[package]
name = "llminus"
version = "0.1.0"
edition = "2024"
# let chains
rust-version = "1.88"
authors = ["Sasha Levin <sashal@kernel.org>"]
description = "LLM-powered git conflict resolution tool for the Linux kernel"
license = "GPL-2.0-only"
repository = "https://github.com/sashalevin/llminus"
# embeds `git describe` for --version and eval reports
build = "git-version.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fastembed = "7"
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
tempfile = "3"
ureq = "3"

[dev-dependencies]
tempfile = "3"
